name: Expand APEX GT WORLD source package
on:
  push:
    paths:
      - 'SourcePackage/part-*.b64'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble, verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat SourcePackage/part-*.b64 | base64 --decode > APEX_GT_WORLD_Source.tar.xz
          if tar -tJf APEX_GT_WORLD_Source.tar.xz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi
          tar -xJf APEX_GT_WORLD_Source.tar.xz --no-same-owner --no-same-permissions -C .
          test -f Tests/validate_source.py
          python3 Tests/validate_source.py
          rm -rf SourcePackage APEX_GT_WORLD_Source.tar.xz
      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No expanded source changes to commit.'
            exit 0
          fi
          git commit -m 'chore: expand APEX GT WORLD source package'
          git push origin HEAD:main
