name: Validate source package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate source structure, package JSON and database security baseline
        run: python3 Tests/validate_source.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --config supabase/functions/settle-race-result/deno.json supabase/functions/settle-race-result/index.ts
          deno check --config supabase/functions/race-session-control/deno.json supabase/functions/race-session-control/index.ts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build dedicated race-server control library
        run: dotnet build Server/RaceServer/ApexGtWorld.RaceServer.csproj --configuration Release
      - name: Build Windows Service host
        run: dotnet build Server/RaceServer.Host/ApexGtWorld.RaceServer.Host.csproj --configuration Release
      - name: Publish self-contained Windows x64 service artifact
        run: dotnet publish Server/RaceServer.Host/ApexGtWorld.RaceServer.Host.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/race-server-win-x64
      - name: Include Windows deployment scripts
        run: |
          Copy-Item Server/RaceServer/Windows/Configure-RaceServerEnvironment.ps1 artifacts/race-server-win-x64/
          Copy-Item Server/RaceServer/Windows/Install-RaceServerService.ps1 artifacts/race-server-win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: apex-gt-world-race-server-win-x64
          path: artifacts/race-server-win-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Run race-server control contract tests
        run: dotnet run --project Server/RaceServer.Tests/ApexGTWorld.RaceServer.Tests.csproj --configuration Release
